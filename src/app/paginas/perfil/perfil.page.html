<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>perfil</ion-title>
  </ion-toolbar>
</ion-header>






<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="profile-card">
    <div class="profile-header">
      <img src="https://via.placeholder.com/100" alt="Avatar de usuario" class="avatar" />
      <h2>Nombre de Usuario</h2>
      <span class="role-badge">Rol de usuario</span>
    </div>

    <div class="profile-body">
      @if (!isEditing) {
        <!-- VISTA LECTURA -->
        <div class="field-group">
          <label>Correo electrónico</label>
          <p>usuario&#64;ejemplo.com</p>
        </div>

        <div class="field-group">
          <label>Biografía</label>
          <p>Aquí irá la biografía del usuario. Este espacio muestra la información completa cargada desde la interfaz visual.</p>
        </div>

        <button type="button" class="btn btn-primary" (click)="toggleEdit()">Editar perfil</button>
      } @else {
        <!-- VISTA EDICIÓN -->
        <form (ngSubmit)="toggleEdit()">
          <div class="field-group">
            <label for="name">Nombre</label>
            <input id="name" type="text" value="Nombre de Usuario" placeholder="Tu nombre" />
          </div>

          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" value="usuario@ejemplo.com" placeholder="tu@email.com" />
          </div>

          <div class="field-group">
            <label for="bio">Biografía</label>
            <textarea id="bio" rows="3" placeholder="Escribe algo sobre ti...">Aquí irá la biografía del usuario.</textarea>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="button" class="btn btn-secondary" (click)="toggleEdit()">Cancelar</button>
          </div>
        </form>
      }
    </div>
  </div>

  <ion-button color="danger" fill="outline" expand="block" routerLink="/login">
    Cerrar sesión
  </ion-button>



</ion-content>
