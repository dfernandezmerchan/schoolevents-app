<ion-content [fullscreen]="true">

  <div class="cabecera-perfil">

    <!-- Avatar -->
    <div class="avatar">
      D
    </div>

    <!-- Datos del usuario -->
    <h2>Daniel Fernández</h2>
    <p>daniel&#64;schoolevents.es</p>

    <!-- Estadísticas -->
    <div class="estadisticas">

      <div>
        <strong>2º</strong>
        <span>DAM</span>
      </div>

      <div>
        <strong>8</strong>
        <span>Eventos</span>
      </div>

      <div>
        <strong>4</strong>
        <span>Favoritos</span>
      </div>

    </div>

  </div>


  <!-- PREFERENCIAS -->
  <p class="titulo-grupo">Preferencias</p>

  <ion-list [inset]="true">

    <!-- Modo oscuro -->
    <ion-item>

      <ion-icon
        slot="start"
        name="moon-outline">
      </ion-icon>

      <ion-label>
        Modo oscuro
      </ion-label>

      <ion-toggle
        slot="end"
        (ionChange)="cambiarTema($event)">
      </ion-toggle>

    </ion-item>


    <!-- Notificaciones -->
    <ion-item>

      <ion-icon
        slot="start"
        name="notifications-outline">
      </ion-icon>

      <ion-label>
        Notificaciones
      </ion-label>

      <ion-toggle
        slot="end"
        [checked]="true">
      </ion-toggle>

    </ion-item>


    <!-- Acerca de -->
    <ion-item
      [button]="true"
      [detail]="true">

      <ion-icon
        slot="start"
        name="information-circle-outline">
      </ion-icon>

      <ion-label>
        Acerca de SchoolEvents
      </ion-label>

    </ion-item>

  </ion-list>


  <!-- CUENTA -->
  <p class="titulo-grupo">Cuenta</p>

  <ion-list [inset]="true">

    <ion-item
      [button]="true"
      class="salir"
      routerLink="/login"
      routerDirection="root">

      <ion-icon
        slot="start"
        name="log-out-outline"
        color="danger">
      </ion-icon>

      <ion-label color="danger">
        Cerrar sesión
      </ion-label>

    </ion-item>

  </ion-list>

</ion-content>
