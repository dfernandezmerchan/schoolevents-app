<ion-content>

  <div class="registro">

    <!-- CABECERA -->
    <div class="cabecera">
      <div class="logo">
        S
      </div>

      <h1>Crear cuenta</h1>
      <p>Únete a SchoolEvents y descubre todos los eventos de tu centro.</p>
    </div>

    <!-- FORMULARIO -->
    <div class="tarjeta-formulario">

      <h2>Datos personales</h2>

      <div class="fila">
        <ion-input
          label="Nombre"
          label-placement="floating"
          fill="outline"
          placeholder="Nombre">
        </ion-input>

        <ion-input
          label="Primer apellido"
          label-placement="floating"
          fill="outline"
          placeholder="Apellido">
        </ion-input>
      </div>

      <ion-input
        label="Segundo apellido"
        label-placement="floating"
        fill="outline"
        placeholder="Segundo apellido">
      </ion-input>

      <ion-input
        label="Fecha de nacimiento"
        label-placement="floating"
        fill="outline"
        type="date">
      </ion-input>

      <h2>Datos de acceso</h2>

      <ion-input
        label="Correo electrónico"
        label-placement="floating"
        fill="outline"
        type="email"
        placeholder="correo@email.com">
      </ion-input>

      <ion-input
        label="Nombre de usuario"
        label-placement="floating"
        fill="outline"
        placeholder="Nombre de usuario">
      </ion-input>

      <ion-input
        label="Contraseña"
        label-placement="floating"
        fill="outline"
        type="password"
        placeholder="Contraseña">
      </ion-input>

      <ion-button expand="block" class="boton-registro">
        Crear cuenta
      </ion-button>

    </div>

    <!-- LOGIN -->
    <div class="volver-login">
      <span>¿Ya tienes una cuenta?</span>
      <a>Inicia sesión</a>
    </div>

  </div>

</ion-content>
