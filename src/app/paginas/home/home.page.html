<app-header titulo="Inicio"></app-header>



<ion-content class="ion-padding" [fullscreen]="true">


  <div class="busquedayfiltros">
    <ion-searchbar
      placeholder="Buscar eventos..."
      (ionInput)="buscarEvento($event)">
    </ion-searchbar>
    <ion-button id="click-trigger">Filtrar</ion-button>
    <ion-popover trigger="click-trigger" triggerAction="click">
      <ng-template>
        <ion-button>Categoria1</ion-button>
        <ion-button>Categoria1</ion-button>
        <ion-button>Categoria1</ion-button>
        <ion-button>Categoria1</ion-button>
      </ng-template>
    </ion-popover>
  </div>


  <ion-segment value="proximos" mode="md">

    <ion-segment-button value="proximos">
      <ion-label>Próximos Eventos</ion-label>
    </ion-segment-button>

    <ion-segment-button value="finalizados">
      <ion-label>Finalizados</ion-label>
    </ion-segment-button>

  </ion-segment>

  @for (evento of eventosFiltrados; track evento.id) {
    <app-tarjetaevento
      [evento]="evento">
    </app-tarjetaevento>
  }

  @if (eventosFiltrados.length === 0) {
    <div class="sin-eventos">
      <ion-icon name="search-outline"></ion-icon>
      <h2>No se han encontrado eventos</h2>
      <p>Prueba con otro término de búsqueda.</p>
    </div>
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/app/crearevento">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
