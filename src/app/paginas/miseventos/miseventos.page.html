<app-header titulo = "Mis Eventos"></app-header>

<ion-content>

  <div class="contenedor-mis-eventos">

    <!-- Resumen -->
    <div class="resumen">

      <div class="resumen-item">
        <div>
          <h2>3</h2>
          <p>Inscripciones</p>
        </div>
      </div>

      <div class="resumen-item">

        <div>
          <h2>4</h2>
          <p>Favoritos</p>
        </div>
      </div>

    </div>

    <!-- Selector de secciones -->
    <ion-segment value="inscripciones" mode="md">

      <ion-segment-button value="inscripciones">
        <ion-label>Inscripciones</ion-label>
      </ion-segment-button>

      <ion-segment-button value="favoritos">
        <ion-label>Favoritos</ion-label>
      </ion-segment-button>

    </ion-segment>

    <!-- Tarjetas de prueba -->
    <div class="lista-eventos">

      @for (evento of eventos; track evento.id) {
        <app-tarjetaeventocomprimida
          [evento]="evento">
        </app-tarjetaeventocomprimida>
      }

    </div>

  </div>

</ion-content>
