<ion-header>
  <app-header></app-header>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-toolbar>
    <ion-title class="titulo">Notificaciones</ion-title>
  </ion-toolbar>

  <ion-segment value="todas" mode="md">

    <ion-segment-button value="todas">
      <ion-label>Todas</ion-label>
    </ion-segment-button>

    <ion-segment-button value="noLeidas">
      <ion-label>No leídas</ion-label>
    </ion-segment-button>

  </ion-segment>

  <p class="titulo-grupo">Hoy</p>

  <ion-list [inset]="true">

    <app-notificacion></app-notificacion>
    <app-notificacion></app-notificacion>

  </ion-list>


  <p class="titulo-grupo">Esta semana</p>

  <ion-list [inset]="true">

    <app-notificacion></app-notificacion>
  </ion-list>

</ion-content>
