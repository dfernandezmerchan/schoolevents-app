<ion-header [translucent]="true">

  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/especies"></ion-back-button>
    </ion-buttons>

    <ion-title>Notificaciones</ion-title>

  </ion-toolbar>

  <ion-toolbar>
    <ion-segment value="todas" mode="md">

      <ion-segment-button value="todas">
        <ion-label>Todas</ion-label>
      </ion-segment-button>

      <ion-segment-button value="noLeidas">
        <ion-label>No leídas</ion-label>
      </ion-segment-button>

    </ion-segment>
  </ion-toolbar>

</ion-header>


<ion-content [fullscreen]="true">

  <!-- HOY -->
  <p class="titulo-grupo">Hoy</p>

  <ion-list [inset]="true">

    <ion-item>

      <div slot="start" class="icono peligro">
        <ion-icon name="flask-outline"></ion-icon>
      </div>

      <ion-label>
        <h3>Nitratos por encima de 0</h3>
        <p>Comunidad del agua - 09:20</p>
      </ion-label>

      <span slot="end" class="punto"></span>

    </ion-item>


    <ion-item>

      <div slot="start" class="icono aviso">
        <ion-icon name="calendar-outline"></ion-icon>
      </div>

      <ion-label>
        <h3>Toca limpiar el filtro</h3>
        <p>Comunidad del agua - 08:50</p>
      </ion-label>

      <span slot="end" class="punto"></span>

    </ion-item>

  </ion-list>


  <!-- ESTA SEMANA -->
  <p class="titulo-grupo">Esta semana</p>

  <ion-list [inset]="true">

    <ion-item>

      <div slot="start" class="icono peligro">
        <ion-icon name="alert-circle-outline"></ion-icon>
      </div>

      <ion-label>
        <h3>Cambio de agua atrasado</h3>
        <p>Hace 2 días - ayer</p>
      </ion-label>

    </ion-item>


    <ion-item>

      <div slot="start" class="icono info">
        <ion-icon name="information-circle-outline"></ion-icon>
      </div>

      <ion-label>
        <h3>Llevas 14 días sin medir</h3>
        <p>Hace 3 días - jueves</p>
      </ion-label>

    </ion-item>


    <ion-item>

      <div slot="start" class="icono info">
        <ion-icon name="calendar-outline"></ion-icon>
      </div>

      <ion-label>
        <h3>Se ha actualizado una ficha</h3>
        <p>Hace 5 días - martes</p>
      </ion-label>

    </ion-item>

  </ion-list>

</ion-content>
