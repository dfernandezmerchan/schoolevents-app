<ion-card [routerLink]="['/app/eventodetalle', evento.id]">

  <!-- Cabecera -->
  <ion-item lines="none">
    <ion-avatar slot="start">
      <div class="avatar">
        {{ evento.organizador.nombre.charAt(0)}}
      </div>
    </ion-avatar>

    <ion-label>
      <h2>{{ evento.titulo }}</h2>
      <p>
        {{evento.organizador.nombre}}
        {{evento.organizador.apellido1}}
      </p>
    </ion-label>

    <ion-button fill="clear" slot="end">
      ⋮
    </ion-button>
  </ion-item>


  <!-- Imagen -->
  <img
    src="https://placehold.co/600x350"
    alt="Imagen del evento"
  />


  <!-- Información -->
  <ion-card-content>

    <h2>{{ evento.titulo }}</h2>

    <p>📍 {{evento.lugar.nombre}}</p>

    <p>🕐 {{ evento.fechaini | date:'dd/MM/yyyy HH:mm' }} </p>

    <p class="descripcion">
      {{ evento.descripcion }}
    </p>

    <div class="parte-inferior">

      <ion-button size="small">
        {{ evento.categoria.nombre }}
      </ion-button>

      <ion-button fill="clear" class="boton-corazon">
        <ion-icon name="heart-outline"></ion-icon>
      </ion-button>

    </div>

  </ion-card-content>

</ion-card>
