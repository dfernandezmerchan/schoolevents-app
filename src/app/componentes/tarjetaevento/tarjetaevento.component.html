<ion-card>

  <!-- Cabecera -->
  <ion-item lines="none">
    <ion-avatar slot="start">
      <div class="avatar">
        A
      </div>
    </ion-avatar>

    <ion-label>
      <h2>Titulo del evento</h2>
      <p>Organizador</p>
    </ion-label>

    <ion-button fill="clear" slot="end">
      ⋮
    </ion-button>
  </ion-item>


  <!-- Imagen -->
  <img
    src="https://ionicframework.com/docs/img/demos/card-media.png"
    alt="Imagen del evento"
  />


  <!-- Información -->
  <ion-card-content>

    <h2>Titulo del Evento</h2>

    <p>📍 Ubicación</p>

    <p>🕐 13 Fecha y Hora</p>

    <p class="descripcion">
      Descripción
    </p>

    <div class="parte-inferior">

      <ion-button size="small">
        Categoría
      </ion-button>

      <ion-button fill="clear" class="boton-corazon">
        <ion-icon name="heart-outline"></ion-icon>
      </ion-button>

    </div>

  </ion-card-content>

</ion-card>
