<ion-card
  class="tarjeta-comprimida"
  [routerLink]="['/app/eventodetalle', evento.id]">

  <img
    src="https://ionicframework.com/docs/img/demos/card-media.png"
    alt="Imagen del evento"
  />

  <ion-card-content>

    <div class="cabecera">
      <div>
        <h2>{{ evento.titulo }}</h2>
        <p>{{ evento.lugar.nombre }}</p>
        <p>{{ evento.fechaini | date:'dd/MM/yyyy HH:mm' }}</p>
      </div>
    </div>

    <div class="parte-inferior">
      <ion-button size="small">
        {{ evento.categoria.nombre }}
      </ion-button>

      <span>{{ evento.organizador.nombre }}</span>
    </div>

  </ion-card-content>

</ion-card>
