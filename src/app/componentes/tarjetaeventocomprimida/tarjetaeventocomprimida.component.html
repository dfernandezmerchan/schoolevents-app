<ion-card class="tarjeta-comprimida" routerLink="/app/eventodetalle">

  <img
    src="https://ionicframework.com/docs/img/demos/card-media.png"
    alt="Imagen del evento"
  />

  <ion-card-content>

    <div class="cabecera">
      <div>
        <h2>Titulo del evento</h2>
        <p>Ubicacion del evento</p>
        <p>Fecha y hora del evento</p>
      </div>
    </div>

    <div class="parte-inferior">
      <ion-button size="small">
        Categoria
      </ion-button>

      <span>Organizador</span>
    </div>

  </ion-card-content>

</ion-card>
